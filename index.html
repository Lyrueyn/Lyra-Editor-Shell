<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="shellBar">
    <div class="brand"><span class="brand-dot"></span>编辑器</div>
    <div id="projectName" class="project-name"></div>
    <div id="currentFile" class="current-file">未打开文件</div>
    <div class="spacer"></div>
    <span id="pluginBadge" class="plugin-badge"></span>
      <select id="themeSelect" class="theme-select" title="界面风格">
        <option value="lyra">经典蓝</option>
        <option value="violet">深空紫</option>
        <option value="emerald">森林绿</option>
        <option value="sunset">暖阳橙</option>
        <option value="sakura">樱花粉</option>
        <option value="light">极简白</option>
      </select>
    <button id="refreshBtn" class="shell-btn" type="button" title="刷新文件树">刷新</button>
  </header>
  <div id="shellBody">
    <aside id="shellSidebar">
      <div class="side-head"><span>项目文件</span><span id="fileCount" class="file-count"></span></div>
      <div id="fileTree" class="file-tree"></div>
      <div class="side-hint">点击 HTML 用 HTML 编辑器，点击 JS 用 JavaScript 编辑器，都在这个窗口里切换。</div>
    </aside>
    <main id="shellMain">
      <iframe id="pluginFrame" title="编辑器插件"></iframe>
      <div id="pluginLoading" class="plugin-loading">正在加载编辑器…</div>
      <div id="shellEmpty" class="shell-empty" hidden>
        <div class="empty-title">没有可打开的编辑器插件</div>
        <div id="emptyMessage" class="empty-message"></div>
      </div>
    </main>
  </div>
  <div id="treeCtxMenu" class="tree-ctx-menu" hidden></div>
  <div id="treeDialogMask" class="tree-dialog-mask" hidden>
    <div class="tree-dialog">
      <h3 id="treeDialogTitle"></h3>
      <div id="treeDialogMessage" class="tree-dialog-message"></div>
      <input id="treeDialogInput" class="tree-dialog-input" type="text" spellcheck="false" autocomplete="off"/>
      <div class="tree-dialog-actions">
        <button id="treeDialogCancel" class="shell-btn" type="button">取消</button>
        <button id="treeDialogOk" class="shell-btn primary" type="button">确定</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js?v=1.3.5"></script>
</body>
</html>
